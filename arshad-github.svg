<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .name {
      font-family: "Courier New", monospace;
      font-size: 120px;
      font-weight: 900;
      letter-spacing: 8px;
      fill: #111;
      stroke: #111;
      stroke-width: 2;
      paint-order: stroke;
    }
    .pixel {
      animation: blink 1.8s steps(2,end) infinite;
    }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: .35; }
    }
  </style>

  <!-- Pixel-style shadow/background dots -->
  <g class="pixel" opacity=".25">
    <rect x="90" y="45" width="12" height="12"/><rect x="110" y="45" width="12" height="12"/>
    <rect x="130" y="45" width="12" height="12"/><rect x="150" y="45" width="12" height="12"/>
    <rect x="730" y="155" width="12" height="12"/><rect x="750" y="155" width="12" height="12"/>
    <rect x="770" y="155" width="12" height="12"/><rect x="790" y="155" width="12" height="12"/>
  </g>

  <text x="450" y="145" text-anchor="middle" class="name">ARSHAD</text>
</svg>
